services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: genomechat
      POSTGRES_USER: genomechat
      POSTGRES_PASSWORD: genomechat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genomechat -d genomechat"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://genomechat:genomechat@postgres:5432/genomechat
      # See the note in .github/workflows/tests.yml. The suite runs against this
      # container from one IP and would otherwise trip the per-IP ceiling, which
      # fails as 429s that look like broken endpoints rather than like a limit.
      RATE_LIMIT_DEFAULT_PER_MIN: "${RATE_LIMIT_DEFAULT_PER_MIN:-100000}"
      RATE_LIMIT_EXPENSIVE_PER_MIN: "${RATE_LIMIT_EXPENSIVE_PER_MIN:-100000}"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    # `docker compose watch` rebuilds automatically when dependencies change.
    # Source is already live via the bind mount above, so only the rebuild
    # trigger is needed here. If you use plain `up` instead, the entrypoint's
    # checksum guard catches the same drift and refuses to start.
    develop:
      watch:
        - action: rebuild
          path: requirements.txt

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - admin

volumes:
  postgres_data:
